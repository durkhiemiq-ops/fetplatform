<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Inline SVG favicon. There is no frontend/public/ directory, so a
         reference to /vite.svg 404ed on every page load. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%233F35B5'/%3E%3Ctext x='32' y='43' font-family='system-ui,sans-serif' font-size='26' font-weight='700' fill='%23fff' text-anchor='middle'%3EFET%3C/text%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>FET Platform</title>
    <script>
      // Applied before first paint so a dark-mode user never sees a white flash.
      (function () {
        try {
          var saved = localStorage.getItem('fet_theme');
          if (!saved) {
            saved = window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          if (saved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        } catch (e) { /* private mode: fall back to light */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
